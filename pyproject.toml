[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatterbox-local-mcp"
version = "0.1.0"
description = "Local Chatterbox English TTS and voice cloning with MCP, HTTP and CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.12", "starlette==0.46.2", "uvicorn==0.34.3", "mcp==1.30.0",
  "httpx>=0.28,<1", "filelock>=3,<5", "huggingface-hub>=1,<2",
  "tomlkit>=0.13,<1", "truststore>=0.10,<1", "soundfile>=0.13,<1",
  "numpy>=1.24,<2", "scipy>=1.12,<2", "pywin32>=310; sys_platform == 'win32'",
]

[project.optional-dependencies]
inference = [
  "torch==2.8.0", "torchaudio==2.8.0", "transformers==5.2.0", "diffusers==0.29.0",
  "librosa==0.11.0", "s3tokenizer==0.3.0", "resemble-perth==1.1.0",
  "conformer==0.3.2", "safetensors==0.5.3", "pykakasi==2.3.0", "pyloudnorm==0.2.0",
  "omegaconf==2.4.0",
]
test = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12"]

[project.scripts]
chatter-tts = "chatterbox_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatterbox_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/Chatterbox-MIT.txt" = "chatterbox_mcp/_upstream/LICENSE"
"licenses/Apache-2.0.txt" = "chatterbox_mcp/_upstream/LICENSE-Apache-2.0"
"THIRD_PARTY_NOTICES.md" = "chatterbox_mcp/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
exclude = ["src/chatterbox_mcp/_upstream", "data"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
